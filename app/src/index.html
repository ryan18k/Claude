<title>Carnet de prépa</title>
<meta name="description" content="Professeur particulier pour la préparation à l'EPFL : conversation, cartes modulables, vérification SymPy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --paper: #F2F3F9; --dots: #D7DAE8; --card: #FFFFFF; --ink: #1B1F33; --muted: #565C78; --faint: #8C91AB;
  --grad: linear-gradient(135deg, #00C4CC 0%, #6B4EFF 55%, #A43CF0 100%); --grad-soft: linear-gradient(135deg, #E3FAFB 0%, #EEEAFF 100%);
  --line: #E3E8F0; --grid: #EEF1F6; --accent: #C8127A; --accent-soft: #FCEAF4; --pen: #2F55D4; --pen-soft: #EAF0FF;
  --ok: #1F7A4D; --ok-soft: #E4F4EB; --warn: #9A5A00; --warn-soft: #FFF3DC; --bad: #B3261E; --bad-soft: #FCE9E7;
  --shadow: 0 1px 2px rgba(27,31,51,.06), 0 12px 32px rgba(60,50,140,.12);
  --font: "Nunito", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --c1: #2F55D4; --c2: #C8127A; --c3: #1F7A4D; --c4: #9A5A00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12131C; --dots: #262839; --card: #1C1E2B; --ink: #ECEDF6; --muted: #A9ADC6; --faint: #7D82A0; --grad-soft: linear-gradient(135deg, #10363A 0%, #2A2350 100%);
    --line: #273041; --grid: #1E2531; --accent: #FF5FB0; --accent-soft: #3A1730; --pen: #93AAFF; --pen-soft: #1D2740;
    --ok: #5FCF95; --ok-soft: #17301F; --warn: #F0B45A; --warn-soft: #34270F; --bad: #FF8A80; --bad-soft: #3A1B19;
    --shadow: 0 2px 4px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35); --c1: #93AAFF; --c2: #FF5FB0; --c3: #5FCF95; --c4: #F0B45A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12131C; --dots: #262839; --card: #1C1E2B; --ink: #ECEDF6; --muted: #A9ADC6; --faint: #7D82A0; --grad-soft: linear-gradient(135deg, #10363A 0%, #2A2350 100%);
  --line: #273041; --grid: #1E2531; --accent: #FF5FB0; --accent-soft: #3A1730; --pen: #93AAFF; --pen-soft: #1D2740;
  --ok: #5FCF95; --ok-soft: #17301F; --warn: #F0B45A; --warn-soft: #34270F; --bad: #FF8A80; --bad-soft: #3A1B19;
  --shadow: 0 2px 4px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35); --c1: #93AAFF; --c2: #FF5FB0; --c3: #5FCF95; --c4: #F0B45A; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background-color: var(--paper); background-image: radial-gradient(var(--dots) 1.1px, transparent 1.3px); background-size: 22px 22px; color: var(--ink); font: 16.5px/1.55 var(--font); overflow: hidden; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .78rem; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 10px; font-size: .78rem; border: 1px solid var(--line); background: var(--card); color: var(--muted); white-space: nowrap; }
button.chip:hover { border-color: var(--faint); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.pen { background: var(--pen-soft); color: var(--pen); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ---------- ossature : barre du haut, scène, conversation au centre ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; flex-wrap: wrap; background: color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top .grow { flex: 1; }
.dock { display: flex; gap: 6px; flex-wrap: wrap; }
.stage { position: relative; min-height: 0; overflow: hidden; }
.convo { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(640px, 100% - 32px); display: flex; flex-direction: column; z-index: 1; }
.log { flex: 1; overflow-y: auto; padding: 8px 4px 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }
.msg { border-radius: 16px; padding: 9px 14px; max-width: 100%; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--grad-soft); max-width: 85%; border-bottom-right-radius: 6px; font-weight: 600; }
.msg.prof { align-self: flex-start; background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.msg .tex p { margin: 0 0 .45em; } .msg .tex p:last-child { margin: 0; }
.msg .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.math-block { overflow-x: auto; overflow-y: hidden; }
.katex-display { margin: .35em 0; overflow-x: auto; overflow-y: hidden; }
.welcome { margin: auto 0; text-align: center; display: grid; gap: 12px; padding-block: 20px; }
.welcome h1 { margin: 0; font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; }
.welcome h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.welcome .sugg { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.welcome .sugg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 0; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); padding: 14px 14px 12px; text-align: left; display: grid; gap: 6px; font-weight: 700; font-size: .95rem; border-top: 4px solid var(--tc, #6B4EFF); }
.tile .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--tc, #6B4EFF) 15%, transparent); font-size: 18px; }
.tile:hover { transform: translateY(-1px); }

/* ---------- barre de saisie ---------- */
.composer { background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 10px 12px; display: grid; gap: 8px; margin-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.composer textarea { border: 0; outline: 0; resize: none; background: transparent; width: 100%; min-height: 26px; max-height: 150px; padding: 2px 4px; line-height: 1.45; }
.preview { font-size: .95rem; padding: 4px 6px; border-radius: 10px; background: var(--paper); overflow-x: auto; }
.tools { display: flex; align-items: center; gap: 8px; }
.ico { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; font-size: 15px; color: var(--muted); padding: 0; }
.ico[aria-pressed="true"] { background: var(--pen-soft); color: var(--pen); border-color: transparent; }
.send { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; font-size: 19px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(107,78,255,.35); }
.send:disabled { opacity: .45; }
.tier { border: 1px solid var(--line); border-radius: 99px; background: var(--card); padding: 5px 10px; font-size: .82rem; color: var(--muted); }
.thumbs { display: flex; gap: 6px; }
.thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }

/* ---------- clavier maths ---------- */
.mathkb { display: grid; gap: 6px; }
.kb-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.kb-tabs button { border: 0; background: none; color: var(--muted); font-size: .8rem; padding: 2px 6px; border-radius: 6px; }
.kb-tabs button[aria-pressed="true"] { background: var(--pen-soft); color: var(--pen); font-weight: 700; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 5px; }
.key { min-height: 46px; border: 0; border-radius: 12px; background: var(--paper); box-shadow: inset 0 -2px 0 var(--line); display: grid; place-items: center; font-size: .95rem; padding: 2px; }
.key:active { background: var(--pen-soft); }
.key.wide { grid-column: span 2; }

/* ---------- cartes modulables ---------- */
.cards { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.card { position: absolute; pointer-events: auto; background: var(--card); border: 0; border-top: 4px solid var(--tc, #6B4EFF); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 200px; min-height: 90px; overflow: hidden; }
.card.big { z-index: 5; }
.card-h { display: flex; align-items: center; gap: 4px; padding: 7px 8px 5px 12px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.card-h .t { flex: 1; font-size: .95rem; color: var(--ink); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-h .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--tc, #6B4EFF) 15%, transparent); font-size: 15px; flex: none; }
.card-h { min-height: 46px; }
.card-h button { border: 0; background: none; color: var(--faint); width: 36px; height: 36px; border-radius: 8px; font-size: 15px; padding: 0; }
.card-h button:hover { background: var(--paper); color: var(--ink); }
.card-b { padding: 4px 14px 14px; overflow: auto; flex: 1; }
.card-b .tex p { margin: 0 0 .4em; }
.rz { position: absolute; right: 0; bottom: 0; width: 38px; height: 38px; cursor: nwse-resize; touch-action: none; }
.rz::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 9px; height: 9px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); border-radius: 0 0 3px 0; }
.enc { border: 0; border-left: 4px solid var(--accent); border-radius: 10px; padding: 6px 10px; margin: 4px 0; background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.src { font-size: .72rem; color: var(--faint); margin-top: 4px; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; padding: 5px 0; }
.step .n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: var(--muted); }
.step.q { background: var(--pen-soft); border-radius: 10px; padding: 6px; }
.orig { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.tbl { border-collapse: collapse; width: 100%; text-align: center; font-size: .92rem; }
.tbl td, .tbl th { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.tbl td:first-child { text-align: left; }
.bar { height: 7px; border-radius: 9px; background: var(--line); overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--pen); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.reussi { background: var(--ok); } .dot.fait { background: var(--pen); } .dot.a_revoir { background: var(--bad); } .dot.en_cours { background: var(--warn); }
svg text { font-family: var(--font); }

/* ---------- étroit (iPad portrait, téléphone) : cartes empilées au-dessus de la conversation ---------- */
.app.narrow .cards { position: static; pointer-events: auto; display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 8px; scroll-snap-type: x mandatory; }
.app.narrow .card { position: relative !important; left: auto !important; top: auto !important; width: min(88vw, 420px) !important; height: auto !important; max-height: 42vh; flex: none; scroll-snap-align: start; }
.app.narrow .rz { display: none; }
.app.narrow .stage { display: flex; flex-direction: column; }
.app.narrow .convo { position: relative; left: auto; transform: none; width: auto; flex: 1; min-height: 0; margin-inline: 16px; }
.app.narrow .card.big { position: fixed !important; inset: 8px !important; width: auto !important; max-height: none; }
@media (prefers-reduced-motion: no-preference) { .msg, .card { animation: rise .16s ease-out; } }
@keyframes rise { from { transform: translateY(3px); opacity: .7; } to { transform: none; opacity: 1; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<div class="app" id="app">
  <header class="top">
    <span class="brand">Carnet</span>

    <span class="grow"></span>
    <div class="dock" id="dock" aria-label="Cartes réduites"></div>
    <button class="chip" id="progBtn">Où j'en suis</button>

          <button type="button" class="ico" id="photoBtn" title="Photo de ta feuille">📷</button>

          <select class="tier" id="tier" aria-label="Niveau de réflexion">
            <option value="quick">Rapide</option><option value="default" selected>Normal</option><option value="complex">Réfléchi</option>
          </select>

<input type="file" id="photoInput" accept="image/*" multiple hidden>

<script>
'use strict';
/* ============================================================ utilitaires */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const today = () => new Date().toLocaleDateString('sv-SE');
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv-SE'); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const deaccent = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const uid = () => Math.random().toString(36).slice(2, 9);
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); }
function toast(msg) { const t = document.createElement('div'); t.className = 'chip warn'; t.style.cssText = 'position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:60;padding:8px 14px;font-size:.9rem;white-space:normal;max-width:calc(100% - 32px);text-align:center'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 4500); }

/* ============================================================ maths à l'écran */
function kx(tex, display) {
  if (!window.katex) return `<code>${esc(tex)}</code>`;
  try { return katex.renderToString(String(tex), {displayMode: !!display, throwOnError: false, strict: 'ignore'}); } catch (e) { return `<code>${esc(tex)}</code>`; }
}
function inline(s) {
  const out = []; const re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$([^$\n]+?)\$|\\\(([\s\S]+?)\\\)/g; let last = 0, m;
  const txt = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = String(s ?? '');
  while ((m = re.exec(s))) { out.push(txt(s.slice(last, m.index))); const d = m[1] ?? m[2]; out.push(d != null ? `<div class="math-block">${kx(d, true)}</div>` : kx(m[3] ?? m[4])); last = re.lastIndex; }
  out.push(txt(s.slice(last))); return out.join('');
}
function renderTex(src) {
  return '<div class="tex">' + String(src || '').split(/\n\s*\n/).map(b => {
    const L = b.split('\n');
    if (L.every(l => l.startsWith('>'))) return `<div class="enc">${L.map(l => `<p>${inline(l.replace(/^>\s?/, ''))}</p>`).join('')}</div>`;
    return `<p>${L.map(inline).join('<br>')}</p>`;
  }).join('') + '</div>';
}
// Écriture du clavier maths (√(x), √[3](x), (a)/(b), x^(2), log_(a)(x)) → LaTeX pour l'aperçu
function plainToTex(src) {
  const MAP = {'*': '\\cdot ', '·': '\\cdot ', '▢': '\\square ', '≤': '\\le ', '≥': '\\ge ', '≠': '\\neq ', '∞': '\\infty ', 'π': '\\pi ', '∈': '\\in ', '∪': '\\cup ', '∩': '\\cap ', 'ℝ': '\\mathbb{R}', '⇒': '\\Rightarrow ', '⇔': '\\Leftrightarrow ', '∀': '\\forall ', '∃': '\\exists ', '±': '\\pm ', '∅': '\\emptyset ', '→': '\\to ', 'θ': '\\theta ', '¬': '\\neg ', '∧': '\\wedge ', '∨': '\\vee ', '∘': '\\circ '};
  const FN = ['arctan', 'arcsin', 'arccos', 'sin', 'cos', 'tan', 'exp', 'log', 'ln', 'lim'];
  function conv(s) {
    let i = 0, out = '';
    const group = () => { let d = 0, j = i; for (; j < s.length; j++) { if (s[j] === '(') d++; else if (s[j] === ')') { d--; if (!d) break; } } const inner = s.slice(i + 1, j); i = Math.min(j + 1, s.length); return inner; };
    const atom = () => { if (s[i] === '(') return conv(group()); const c = s[i] ?? ''; i++; return MAP[c] ?? c; };
    while (i < s.length) {
      const c = s[i];
      if (c === '√') { i++; let n = null; if (s[i] === '[') { const j = s.indexOf(']', i); n = s.slice(i + 1, j < 0 ? s.length : j); i = j < 0 ? s.length : j + 1; } const a = atom(); out += n ? `\\sqrt[${conv(n)}]{${a}}` : `\\sqrt{${a}}`; continue; }
      if (c === '^' || c === '_') { i++; out += `${c}{${atom()}}`; continue; }
      if (c === '(') { const g = conv(group()); if (s[i] === '/' && s[i + 1] === '(') { i++; out += `\\frac{${g}}{${conv(group())}}`; } else out += `\\left(${g}\\right)`; continue; }
      const f = FN.find(f => s.startsWith(f, i) && !/[a-z]/i.test(s[i - 1] || ''));
      if (f) { out += f.startsWith('arc') ? `\\operatorname{${f}}` : '\\' + f; i += f.length; continue; }
      out += MAP[c] ?? c; i++;
    }
    return out;
  }
  try { return conv(src); } catch (e) { return src; }
}

/* ============================================================ état */
const APP = {
  PASS: {}, NOTION: {}, EX: {}, ITEM: {}, VAR: {}, SERIE: {}, CHAP: {},
  cap: {db: null, sample: null, limits: null},
  store: 'local', sympy: {state: 'off'},
  profil: null, ex: {}, mem: null, msgs: [], cards: [], current: null, photos: [], busy: false, ctl: null,
};

/* ============================================================ stockage (db synchronisée, sinon ce navigateur) */
const Store = {
  q: {}, mode: 'local',
  async init() { const db = window.claude?.use ? await claude.use('db').catch(() => null) : null; if (db) { APP.cap.db = db; this.mode = 'db'; } APP.store = this.mode; },
  async get(p) {
    if (this.mode === 'db') { try { const s = await APP.cap.db.doc(p).get(); return s.exists ? s.data() : null; } catch (e) { return null; } }
    try { return JSON.parse(localStorage.getItem('carnet:' + p) || 'null'); } catch (e) { return null; }
  },
  async list(c) {
    if (this.mode === 'db') { try { const s = await APP.cap.db.collection(c).limit(1000).get(); return Object.fromEntries(s.docs.map(d => [d.id, d.data()])); } catch (e) { return {}; } }
    const o = {}; try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key.startsWith('carnet:' + c + '/')) o[key.split('/').pop()] = JSON.parse(localStorage.getItem(key)); } } catch (e) {} return o;
  },
  set(p, data) {
    const body = JSON.parse(JSON.stringify(data));
    const run = async () => {
      if (this.mode === 'db') { try { await APP.cap.db.doc(p).set(body); } catch (e) { if (e?.code === 'unavailable') { await new Promise(r => setTimeout(r, 900)); try { await APP.cap.db.doc(p).set(body); } catch (e2) {} } else if (e?.code !== 'revoked') toast('Sauvegarde impossible (' + (e?.code || e) + ')'); } }
      else { try { localStorage.setItem('carnet:' + p, JSON.stringify(body)); } catch (e) {} }
    };
    return (this.q[p] = (this.q[p] || Promise.resolve()).then(run, run));
  },
};
const saveTimers = {};
function saveLater(key, fn, ms = 600) { clearTimeout(saveTimers[key]); saveTimers[key] = setTimeout(fn, ms); }
const saveProfil = () => saveLater('profil', () => Store.set('profil/moi', APP.profil));
const saveBoard = () => saveLater('board', () => Store.set('tableau/actuel', {cards: APP.cards.filter(c => c.type !== 'photo').map(({_pts, ...c}) => c)}), 800);
const saveConv = d => saveLater('conv' + d, () => Store.set('conv/' + d, {msgs: APP.msgs.filter(m => m.d === d).map(({d, ...m}) => m)}));
const saveMem = () => Store.set('memoire/longue', APP.mem);

/* ============================================================ SymPy (worker Pyodide) */
const Sym = {
  w: null, n: 0, wait: {},
  start() {
    if (this.w || APP.sympy.state === 'ko') return;
    APP.sympy.state = 'chargement'; renderStatus();

    (APP.mem?.sessions || []).length ? `[SÉANCES PRÉCÉDENTES] ${APP.mem.sessions.slice(-3).map(s => s.date + ' : ' + s.resume).join(' | ')}` : '',
    D ? `[DIFFICULTÉS RÉCURRENTES] ${D}` : '',
    due.length ? `[RÉVISIONS PRÉVUES AUJOURD'HUI] ${due.slice(0, 8).join(', ')}` : '',
    P.reprise ? `[OÙ REPRENDRE] ${P.reprise}` : '',
    `[CARTES À L'ÉCRAN] ${APP.cards.map(c => (c.min ? '(réduite) ' : '') + (c.titre || TITLES[c.type])).join(', ') || 'aucune'}`,
    APP.current ? `[EXERCICE EN COURS] ${APP.current.kind === 'exo' ? `mini-exercice : $${APP.current.enonce}$ (solution SymPy : $${APP.current.solution_tex || '?'}$)` : APP.current.ref}` : '',
    `[EXTRAITS DU CORPUS]\n${corpusFor([...recentUser, userText])}`,
    pre ? `[SYMPY] ${pre}` : '',
  ].filter(Boolean).join('\n\n').slice(0, 42000);
}

/* ============================================================ vérification SymPy avant l'appel */
function looksLikeAnswer(t) { return t.length < 90 && !/\?/.test(t) && !/^(pourquoi|comment|explique|montre|epingle|affiche|enleve|retire|je |j'|jai|c'est|ok\b|merci|oui\b|non\b|on |peux|tu |d'accord|bon\b)/i.test(deaccent(t.trim())); }
async function precheck(text) {
  let target = null, answer = text;
  const r = resolveRef(text);
  if (r && APP.ITEM[r] && /[:=]/.test(text)) { target = {kind: 'item', ref: r}; answer = text.slice(text.search(/[:=]/) + 1); }
  else if (APP.current && looksLikeAnswer(text)) target = APP.current;
  if (!target) return null;
  const spec = target.kind === 'exo' ? target.spec : APP.ITEM[target.ref]?.verification.spec?.[0];
  if (!spec) return null;
  let res; try { res = await Sym.call('check_text', {spec, text: answer}); } catch (e) { return {line: `SymPy indisponible (${e.message}) : réponse non vérifiée.`, badge: B.nv('SymPy indisponible')}; }
  if (res.ok == null) return {line: `SymPy n'a pas pu lire la réponse (${res.detail}).`, badge: B.nv('illisible pour SymPy')};
  if (target.kind === 'exo') {
    const card = APP.cards.find(c => c.id === target.card); if (card) { card.statut = res.ok ? 'ok' : 'ko'; renderCards(); saveBoard(); }
    learn(target.notions, res.ok ? 1 : 0);
    if (res.ok) APP.current = null;
  } else {
    const it = APP.ITEM[target.ref];
    setItem(it.id, res.ok ? 'reussi' : 'a_revoir', {reponse: answer.trim().slice(0, 120)});
    learn(it.ex.notions, res.ok ? 1 : 0);
  }
  return {line: `La réponse de Ryan « ${answer.trim()} » à ${target.kind === 'exo' ? 'ton mini-exercice' : target.ref} est ${res.ok ? 'JUSTE' : 'FAUSSE'} (SymPy ; lu : ${res.lu}). Attendu : ${res.sympy}.`,
          badge: res.ok ? B.ok() : B.ko()};
}

/* ============================================================ exécution des opérations du prof */
async function applyOps(ops, msg) {
  const done = [];
  for (const o of Array.isArray(ops) ? ops.slice(0, 10) : []) {
    try {
      switch (o.op) {
        case 'formules': addCard({type: 'formules', titre: o.titre || 'Formules', items: (o.items || []).map(String).slice(0, 12), source: o.source}); done.push({...o, chip: '📌 ' + (o.titre || 'Formules')}); break;
        case 'graphe': addCard({type: 'graphe', titre: o.titre || 'Graphique', fonctions: (o.fonctions || []).slice(0, 4), xr: o.x, yr: o.y, legende: o.legende}); done.push({...o, chip: '📈 ' + (o.titre || 'Graphique')}); break;
        case 'dessin': addCard({type: 'dessin', titre: o.titre || 'Dessin', svg: String(o.svg || '').slice(0, 30000), legende: o.legende}); done.push({...o, chip: '✏️ ' + (o.titre || 'Dessin')}); break;
        case 'tableau': addCard({type: 'tableau', titre: o.titre || 'Tableau', lignes: o.lignes, legende: o.legende}); done.push({...o, chip: '▦ ' + (o.titre || 'Tableau')}); break;
        case 'demo': {
          const etapes = (o.etapes || []).slice(0, 12).map(s => ({...s}));
          const c = addCard({type: 'demo', titre: o.titre || 'Démonstration', etapes, vu: 1});
          done.push({...o, chip: '🪜 ' + (o.titre || 'Démonstration')});
          etapes.forEach(async s => { if (!s.verif) return; try { const r = await Sym.call('run', {spec: s.verif, answer: s.verif.answer}); s.v = r.ok ? B.ok() : r.ok === false ? B.ko() : B.nv(); } catch (e) { s.v = B.nv(); } if (APP.cards.includes(c)) { renderCards(); saveBoard(); } });
          break;
        }
        case 'exercice': if (APP.ITEM[o.ref] || APP.EX[o.ref]) { addCard({type: 'exercice', titre: 'Exercice · ' + label(o.ref), ref: o.ref}); APP.current = {kind: 'item', ref: APP.ITEM[o.ref] ? o.ref : APP.EX[o.ref].items[0].id}; done.push({...o, chip: '📄 ' + label(o.ref)}); } break;
        case 'cours': if (APP.PASS[o.ref]) { addCard({type: 'cours', titre: APP.PASS[o.ref].titre, ref: o.ref}); done.push({...o, chip: '📖 ' + APP.PASS[o.ref].titre}); } break;
        case 'exo': {
          const spec = {...(o.spec || {})}; delete spec.answer;
          const c = addCard({type: 'exo', titre: 'À toi', consigne: o.consigne, enonce: String(o.enonce || ''), spec, notions: o.notions || []});
          APP.current = {kind: 'exo', card: c.id, spec, enonce: c.enonce, notions: c.notions};
          done.push({...o, chip: '✍️ ' + (o.consigne || 'À toi')});
          Sym.call('compute', {spec}).then(sol => { c.solution_tex = sol.latex; if (APP.current?.card === c.id) APP.current.solution_tex = sol.latex; renderCards(); saveBoard(); })
            .catch(() => { c.solution_tex = null; renderCards(); });
          break;
        }
        case 'retirer': removeCards(o.cible); break;
        case 'progression': addCard({type: 'progression', titre: 'Où tu en es'}); break;
        case 'etat': { const ids = refsExpand(o.refs); const st = ['fait', 'reussi', 'a_revoir', 'nouveau'].includes(o.statut) ? o.statut : 'fait'; ids.forEach(id => setItem(id, st)); if (ids.length) done.push({...o, chip: `✓ ${ids.length} question${ids.length > 1 ? 's' : ''} : ${st.replace('_', ' ')}`}); break; }
        case 'maitrise': if (APP.NOTION[o.notion]) { const s = notion(o.notion); s.etat = o.niveau; if (s.m == null) s.m = o.niveau === 'acquis' ? .85 : o.niveau === 'fragile' ? .5 : .15; saveProfil(); } break;
        case 'difficulte': difficulty(String(o.tag || 'difficulte').slice(0, 40), String(o.description || '').slice(0, 100), o.notion, o.ref); done.push({...o, chip: '🧠 noté : ' + String(o.description || o.tag).slice(0, 40)}); break;
        case 'reprise': APP.profil.reprise = String(o.texte || '').slice(0, 80); saveProfil(); break;
        case 'verdict': {
          const it = APP.ITEM[o.ref]; if (!it) break;
          const spec = it.verification.spec?.[0]; let ok = o.juge === 'juste' ? true : o.juge === 'faux' ? false : null, badge = B.nv('jugé par le prof');
          if (spec && o.reponse) { try { const r = await Sym.call('check_text', {spec, text: String(o.reponse)}); if (r.ok != null) { const b = r.ok ? B.ok(label(it.id)) : B.ko(label(it.id)); badge = ok != null && r.ok !== ok ? b + ' <span class="chip warn">le prof avait jugé l\'inverse : SymPy fait foi</span>' : b; ok = r.ok; } } catch (e) {} }
          if (ok != null) { setItem(it.id, ok ? 'reussi' : 'a_revoir', {reponse: String(o.reponse || '').slice(0, 120)}); learn(it.ex.notions, ok ? 1 : 0); }
          msg.v = (msg.v || '') + badge; break;
        }
        case 'verifier': for (const s of (o.specs || []).slice(0, 5)) {
          const lab = (s.expr ? `${p2t(s.expr)} = ${p2t(s.answer)}` : `${p2t(s.lhs || s.rel)}${s.rhs ? ' = ' + p2t(s.rhs) : ''} → ${p2t(s.answer)}`).slice(0, 50);
          try { const r = await Sym.call('run', {spec: s, answer: s.answer}); msg.v = (msg.v || '') + (r.ok ? B.ok(lab) : r.ok === false ? B.ko(lab) : B.nv(lab)); } catch (e) { msg.v = (msg.v || '') + B.nv(lab); }
        } break;
      }
    } catch (e) { console.warn('opération ignorée', o, e); }
  }
  return done;
}

/* ============================================================ envoi d'un message */
async function send(text, photos = []) {
  if (APP.busy) return;
  const d = today();
  const um = {r: 'u', x: text, t: Date.now(), d, ph: photos.length || undefined};
  APP.msgs.push(um); renderLog(); saveConv(d);
  const sample = APP.cap.sample;
  if (!sample) { toast('Le professeur n\'est pas disponible ici : ouvre la page dans claude.ai et autorise Claude.'); return; }
  APP.busy = true; onInput(); renderLog('<span style="color:var(--faint)">…</span>');
  let pre = null; try { pre = await precheck(text); } catch (e) {}
  if (pre) { um.v = pre.badge; renderLog('<span style="color:var(--faint)">…</span>'); }
  const hist = APP.msgs.filter(m => m.t > (APP.mem?.jusqua || 0) && m !== um).slice(-14);
  const turns = [{role: 'user', content: RULES + '\n\n' + contextBlock(text, pre?.line) + '\n\n(Fin du contexte. La conversation suit.)'}];
  for (const m of hist) turns.push({role: m.r === 'u' ? 'user' : 'assistant', content: m.r === 'u' ? m.x + (m.ph ? ' (photo jointe)' : '') : m.x});
  turns.push({role: 'user', content: text + (photos.length ? '\n(Photo de ma feuille jointe : lis-la et repère l\'étape exacte qui coince.)' : '')});
  const ctl = APP.ctl = new AbortController();
  const tier = $('#tier').value; let reply = '', applied = null;
  const opts = {cache: false, signal: ctl.signal, modelTier: tier, onText: ({text: t}) => { reply = t; const L = $('#live'); if (L) { L.innerHTML = renderTex(strip(t)) || '…'; $('#log').scrollTop = $('#log').scrollHeight; } }};
  if (photos.length) opts.images = photos;
  try { const r = await sample(turns, opts).catch(async e => { if (e.code === 'images_unavailable' && photos.length) { toast('Photo impossible dans cette vue : envoi sans la photo.'); delete opts.images; return sample(turns, opts); } throw e; }); reply = r.text; applied = r.modelTierApplied; if (r.truncated) toast('Réponse coupée : demande-lui de continuer.'); }
  catch (e) {
    reply = e.text || '';
    if (e.code !== 'cancelled') toast({rate_limited: 'Limite d\'usage atteinte : réessaie plus tard.', not_granted: 'Claude n\'est pas autorisé pour cette page.', images_unavailable: 'Claude ne peut pas recevoir de photo dans cette vue (limite de claude.ai). Ton message est parti sans elle : décris ou tape ta réponse.', image_rejected: 'Photo refusée (format ou taille). Essaie une capture d\'écran de la photo.', prompt_too_large: 'Message trop long.'}[e.code] || 'Pas de réponse (' + e.code + ').');
    if (e.code === 'not_granted' || e.code === 'sampling_disabled') APP.cap.sample = null;
  }
  const tn = $('#tierNote'); tn.hidden = !applied || applied === tier; if (applied && applied !== tier) tn.textContent = 'réponse en mode ' + ({quick: 'Rapide', default: 'Normal', complex: 'Réfléchi'}[applied] || applied);
  APP.busy = false;
  if (reply.trim()) {
    const pm = {r: 'p', x: reply, t: Date.now(), d};
    APP.msgs.push(pm); renderLog();
    let ops = []; const m = reply.match(/```cartes\s*([\s\S]*?)```/);
    if (m) { try { ops = JSON.parse(m[1]); } catch (e) { pm.v = B.nv('cartes illisibles'); } }
    pm.ops = await applyOps(ops, pm);
    renderLog(); saveConv(d);
    const st = (APP.profil.stats ||= {n: 0, longs: 0}); st.n++; if (strip(reply).replace(/\$[^$]*\$/g, '').split(/\s+/).filter(Boolean).length > 70) st.longs++; saveProfil();
  } else renderLog();
  onInput();
  maintainMemory();
}
async function maintainMemory() {                                      // la mémoire ne sature jamais : les vieux échanges deviennent un résumé
  const sample = APP.cap.sample; if (!sample) return;
  const fresh = APP.msgs.filter(m => m.t > (APP.mem.jusqua || 0));
  if (fresh.length > 28) {
    const old = fresh.slice(0, 16);
    try {
      const {text} = await sample(`Mets à jour la mémoire d'un professeur particulier sur son élève Ryan. En 120 mots maximum, texte simple : ce qui a été travaillé, ce qui est acquis, ce qui bloque encore, où on en est.\nMémoire actuelle : ${APP.mem.resume || '(vide)'}\n\nÉchanges à intégrer :\n` + old.map(m => (m.r === 'u' ? 'Ryan : ' : 'Prof : ') + strip(m.x).slice(0, 600)).join('\n'), {modelTier: 'quick', cache: false});
      APP.mem.resume = text.trim().slice(0, 1200); APP.mem.jusqua = old.at(-1).t; saveMem();
    } catch (e) {}
  }
  const prev = APP.profil.dernier_jour;
  if (prev && prev !== today() && !(APP.mem.sessions || []).some(s => s.date === prev)) {
    const conv = await Store.get('conv/' + prev);
    if (conv?.msgs?.length) {
      try {
        const {text} = await sample(`Résume en 2 phrases très courtes la séance d'étude de Ryan du ${prev} : ce qui a été fait, ce qui bloque. Texte simple.\n\n` + conv.msgs.map(m => (m.r === 'u' ? 'Ryan : ' : 'Prof : ') + strip(m.x).slice(0, 300)).join('\n').slice(0, 20000), {modelTier: 'quick', cache: false});
        (APP.mem.sessions ||= []).push({date: prev, resume: text.trim().slice(0, 400)}); APP.mem.sessions = APP.mem.sessions.slice(-15); saveMem();
      } catch (e) {}
    }
  }
  if (APP.profil.dernier_jour !== today()) { APP.profil.dernier_jour = today(); saveProfil(); }
}

/* ============================================================ statut */
function renderStatus() {
  if (!APP.profil) return;
  const s = APP.sympy.state;
  $('#status').innerHTML = (s === 'pret' ? '<span class="chip ok">SymPy prêt</span>' : s === 'chargement' ? '<span class="chip warn">SymPy se charge…</span>' : s === 'ko' ? `<button class="chip bad" data-a="sympy-info">SymPy indisponible · détails</button>` : '')
    + (APP.store === 'db' ? '' : '<span class="chip warn" title="La progression reste dans ce navigateur">non synchronisé</span>')
    + (APP.cap.sample ? '' : '<span class="chip warn">prof indisponible ici</span>')
    + (APP.cap.sample && APP.cap.limits && !APP.cap.limits.images ? '<span class="chip warn" title="claude.ai ne transmet pas les images depuis cette vue">photos non transmises ici</span>' : '');
  const mc = $('#memChip'); const D = Object.entries(APP.profil.difficultes || {}).sort((a, b) => b[1].n - a[1].n)[0];
  const txt = [APP.profil.reprise && 'reprise : ' + APP.profil.reprise, D && 'à revoir : ' + (D[1].description || D[0])].filter(Boolean).join(' · ');
  mc.hidden = !txt || isNarrow(); mc.textContent = 'Mémoire · ' + txt;
}

/* ============================================================ évènements */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-a],[data-key],[data-kbtab]'); if (!t) return;
  if (t.dataset.kbtab) { kbTab = t.dataset.kbtab; return renderKB(); }
  if (t.dataset.key) { ev.preventDefault(); return insertTemplate(t.dataset.key); }
  const a = t.dataset.a, c = APP.cards.find(x => x.id === t.dataset.id);
  if (a === 'close' && c) { APP.cards = APP.cards.filter(x => x !== c); if (APP.current?.card === c.id) APP.current = null; renderCards(); saveBoard(); }
  if (a === 'min' && c) { c.min = true; c.big = false; renderCards(); saveBoard(); }
  if (a === 'restore' && c) { c.min = false; renderCards(); saveBoard(); }
  if (a === 'big' && c) { c.big = !c.big; renderCards(); saveBoard(); }
  if (a === 'next-step' && c) { c.vu = (c.vu || 1) + 1; renderCards(); saveBoard(); }
  if (a === 'all-steps' && c) { c.vu = c.etapes.length; renderCards(); saveBoard(); }
  if (a === 'sympy-info') { addCard({type: 'tableau', titre: 'Diagnostic SymPy', lignes: [['Élément', 'Valeur'], ['Erreur', esc(APP.sympy.info || '?')], ['Navigateur', esc(navigator.userAgent)], ['Page', esc(location.origin)]], legende: 'Envoie une capture de cette carte à Claude Code.'}).big = true; renderCards(); return; }
  if (a === 'say') { $('#input').value = t.dataset.t; onInput(); $('#composer').requestSubmit(); }
  if (a === 'reopen') { const m = APP.msgs.find(x => String(x.t) === t.dataset.t); const o = m?.ops?.[+t.dataset.k]; if (o) applyOps([o], {}); }
});
$('#composer').addEventListener('submit', ev => {
  ev.preventDefault(); if (APP.busy) return;
  const v = $('#input').value.replace(/▢/g, '').trim(); const ph = APP.photos;
  if (!v && !ph.length) return;
  $('#input').value = ''; APP.photos = []; $('#thumbs').innerHTML = ''; onInput();
  send(v || 'Voici ma feuille.', ph);
});
$('#input').addEventListener('input', onInput);
$('#input').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey && !isNarrow()) { ev.preventDefault(); $('#composer').requestSubmit(); } });
$('#kbBtn').addEventListener('click', () => { const kb = $('#mathkb'); kb.hidden = !kb.hidden; $('#kbBtn').setAttribute('aria-pressed', String(!kb.hidden)); if (!kb.hidden) renderKB(); });
$('#photoBtn').addEventListener('click', () => $('#photoInput').click());
// Toute photo (HEIC de l'iPad compris) devient un JPEG d'au plus 1600 px avant l'envoi
async function toJpeg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image illisible')); i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), 'image/jpeg', .88));
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}
$('#photoInput').addEventListener('change', async ev => {
  const max = APP.cap.limits?.images?.maxCount || 4;
  const files = [...ev.target.files].slice(0, max); ev.target.value = '';
  APP.photos = await Promise.all(files.map(toJpeg));
  $('#thumbs').innerHTML = APP.photos.map(f => `<img src="${URL.createObjectURL(f)}" alt="photo jointe">`).join('');
  if (APP.photos[0]) addCard({type: 'photo', titre: 'Ta feuille', src: URL.createObjectURL(APP.photos[0])});
  onInput(); $('#input').focus();
});
$('#progBtn').addEventListener('click', () => { const c = APP.cards.find(x => x.type === 'progression' && !x.min); if (c) { APP.cards = APP.cards.filter(x => x !== c); renderCards(); saveBoard(); } else addCard({type: 'progression', titre: 'Où tu en es'}); });
$('#tier').addEventListener('change', () => { APP.profil.tier = $('#tier').value; saveProfil(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && APP.busy) APP.ctl?.abort(); });

/* ============================================================ démarrage */
(async function boot() {
  fetch('katex/katex.css').then(r => r.ok ? r.text() : '').then(css => { const s = document.createElement('style'); s.textContent = css; document.head.append(s); }).catch(() => {});
  try { await loadCorpus(); } catch (e) { $('#log').innerHTML = `<p>Le cours ne se charge pas : ${esc(e.message)}</p>`; return; }
  await Store.init();
  const [profil, ex, mem, board] = await Promise.all([Store.get('profil/moi'), Store.list('ex'), Store.get('memoire/longue'), Store.get('tableau/actuel')]);
  APP.profil = profil || {prenom: 'Ryan', debut: today(), notions: {}, difficultes: {}};
  APP.ex = ex || {}; APP.mem = mem || {resume: '', jusqua: 0, sessions: []};
  APP.cards = (board?.cards || []).filter(c => c.type !== 'photo');
  if (APP.profil.tier) $('#tier').value = APP.profil.tier;
  const d = today(), prev = APP.profil.dernier_jour;
  const convs = await Promise.all([prev && prev !== d ? Store.get('conv/' + prev) : null, Store.get('conv/' + d)]);
  APP.msgs = [...(convs[0]?.msgs || []).slice(-12).map(m => ({...m, d: prev})), ...(convs[1]?.msgs || []).map(m => ({...m, d}))];
  if (!profil) Store.set('profil/moi', APP.profil);
  renderLog(); renderCards(); onInput();
  if (window.claude?.use) claude.use('sample').then(async s => {
    APP.cap.sample = s;
    if (s) APP.cap.limits = await s.limits().catch(() => null);
    renderStatus();
  });
  setTimeout(() => Sym.start(), 800);
})();
